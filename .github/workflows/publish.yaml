# Build the Hugo Blox site and deploy it to GitHub Pages.
# Requires Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy website to GitHub Pages

env:
  # Pinned to the version used by Hugo Blox Builder 0.3.1 (see hugoblox.yaml).
  HUGO_VERSION: '0.136.5'
  GO_VERSION: '1.24'
  # Site search index generator (https://pagefind.app).
  PAGEFIND_VERSION: '1.5.2'
  TZ: Europe/Madrid

on:
  # Build and deploy on every push to main
  push:
    branches: ['main']
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history for Hugo's .GitInfo and .Lastmod
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Go (required by Hugo Modules)
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Hugo extended (official release, checksum verified)
        run: |
          cd "${{ runner.temp }}"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          file="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sfLO "${base}/${file}"
          curl -sfLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${file}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${file}"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          hugo version
          go version
          node --version

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build Pagefind search index
        run: npx --yes "pagefind@${PAGEFIND_VERSION}" --site public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
